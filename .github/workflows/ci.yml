name: CI

on:
  push:
    branches: [ main, 'feature/*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # enable manual execution

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Compile and release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout current branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Nix
        uses: cachix/install-nix-action@v31

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # Cache the standard store and its database, keyed by the toolchain.
          primary-key: nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile LaTeX document
        run: nix develop --no-update-lock-file --command make build

      - name: Create tag name
        if: github.ref == 'refs/heads/main'
        run:  |
          VERSION="prod-$(date -u +'%Y%m%d%H%M%SZ')"
          echo "release_tag=$VERSION" >> $GITHUB_ENV

      - name: Create tag
        if: github.ref == 'refs/heads/main'
        uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ env.release_tag }}

      - name: Create Github Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.release_tag }}
          draft: false
          prerelease: false
          files: hypergeometric.pdf
